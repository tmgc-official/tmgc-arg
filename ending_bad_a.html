<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAD END A | TOKYO MIDNIGHT GIRLS CLUB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #d0a0a0;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .end-wrap {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .end-label {
      font-size: 9px;
      letter-spacing: 6px;
      color: #504040;
      margin-bottom: 32px;
    }

    .message-block {
      background: #140505;
      border: 1px solid #2a0a0a;
      padding: 28px;
      margin-bottom: 20px;
      text-align: left;
    }

    .message-from {
      font-size: 10px;
      color: #604040;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .message-text {
      font-size: 13px;
      color: #c08080;
      line-height: 2;
    }

    .message-text .heart { color: #e06060; }

    .status-note {
      margin-top: 28px;
      font-size: 10px;
      color: #3a2a2a;
      letter-spacing: 1px;
      line-height: 2;
    }

    .top-link {
      display: inline-block;
      margin-top: 40px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #504040;
      text-decoration: none;
      border: 1px solid #2a1a1a;
      padding: 10px 24px;
      transition: all 0.2s;
    }

    .top-link:hover { color: #c08080; border-color: #504040; }

    .fade-in { opacity: 0; animation: fadeIn 2s ease forwards; }
    .fade-in:nth-child(1) { animation-delay: 0.5s; }
    .fade-in:nth-child(2) { animation-delay: 1.5s; }
    .fade-in:nth-child(3) { animation-delay: 3s; }
    .fade-in:nth-child(4) { animation-delay: 4.5s; }
    @keyframes fadeIn { to { opacity: 1; } }

    @media (max-width: 640px) {
      body { align-items: flex-start; padding: 32px 16px; }
      .message-block { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="end-wrap">
    <div class="end-label fade-in">B A D &nbsp; E N D &nbsp; A</div>

    <div class="message-block fade-in">
      <div class="message-from">天使♡あすか より</div>
      <div class="message-text">
        情報のご提供、ありがとうございます<span class="heart">♡</span><br>
        大切に保管します。
      </div>
    </div>

    <div class="status-note fade-in">
      数日後、もえにゃのプロフィールが消えた。
    </div>

    <a class="top-link fade-in" href="index.html">← TOP</a>
  </div>
</body>
</html>
