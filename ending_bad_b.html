<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAD END B | TOKYO MIDNIGHT GIRLS CLUB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #888888;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .end-wrap { max-width: 520px; width: 100%; text-align: center; }
    .end-label { font-size: 9px; letter-spacing: 6px; color: #3a3a3a; margin-bottom: 40px; }

    .status-wrap { margin-bottom: 32px; }
    .status-line { font-size: 13px; color: #6a6a6a; line-height: 2.4; }

    .blog-update {
      background: #0f0f0f;
      border: 1px solid #1a1a1a;
      padding: 24px;
      text-align: left;
      margin-bottom: 24px;
    }
    .blog-from { font-size: 9px; color: #3a3a3a; letter-spacing: 2px; margin-bottom: 8px; }
    .blog-title-line { font-size: 12px; color: #6a5a5a; }

    .top-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #3a3a3a;
      text-decoration: none;
      border: 1px solid #1a1a1a;
      padding: 10px 24px;
      transition: all 0.2s;
    }
    .top-link:hover { color: #888; border-color: #3a3a3a; }

    .fade-in { opacity: 0; animation: fadeIn 2s ease forwards; }
    .fade-in:nth-child(1) { animation-delay: 1s; }
    .fade-in:nth-child(2) { animation-delay: 2.5s; }
    .fade-in:nth-child(3) { animation-delay: 4s; }
    .fade-in:nth-child(4) { animation-delay: 5.5s; }
    @keyframes fadeIn { to { opacity: 1; } }

    @media (max-width: 640px) {
      body { align-items: flex-start; padding: 32px 16px; }
      .blog-update { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="end-wrap">
    <div class="end-label fade-in">B A D &nbsp; E N D &nbsp; B</div>

    <div class="status-wrap fade-in">
      <div class="status-line">
        しばらくして、もえにゃのプロフィールが更新された。<br><br>
        <span style="color:#4a3a3a; font-style:italic;">「卒業しました。」</span>
      </div>
    </div>

    <div class="blog-update fade-in">
      <div class="blog-from">天使♡あすか &nbsp;／&nbsp; 最新ブログ</div>
      <div class="blog-title-line">「新しい季節のはじまりに♡」</div>
    </div>

    <div class="status-line fade-in" style="font-size:11px; color:#3a3a3a;">
      お店は普通に、今日も続いていく。
    </div>

    <a class="top-link fade-in" href="index.html">← TOP</a>
  </div>
</body>
</html>
