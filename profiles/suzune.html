<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>すずね | TOKYO MIDNIGHT GIRLS CLUB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0e8e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
    }
    header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid #2a1a1a; }
    .site-title { font-size: 13px; letter-spacing: 6px; color: #c8a0a0; text-transform: uppercase; margin-bottom: 6px; }
    nav { display: flex; justify-content: center; gap: 32px; padding: 16px 20px; border-bottom: 1px solid #1a0a0a; }
    nav a { color: #c8a0a0; text-decoration: none; font-size: 11px; letter-spacing: 2px; transition: color 0.2s; }
    nav a:hover { color: #f0c0c0; }

    .profile-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
      display: flex;
      gap: 48px;
      align-items: flex-start;
    }
    .profile-photo {
      flex-shrink: 0;
      width: 220px;
      background: linear-gradient(160deg, #0f0f1a 0%, #151525 100%);
      overflow: hidden;
    }
    .profile-photo img { width: 100%; height: auto; display: block; filter: brightness(0.85) saturate(0.7); }
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-placeholder span { font-size: 10px; color: #2a2a3a; }

    .profile-info { flex: 1; }
    .cast-name { font-size: 26px; color: #c0c8e8; letter-spacing: 2px; margin-bottom: 6px; }
    .cast-name-sub { font-size: 10px; color: #4a4a6a; letter-spacing: 3px; margin-bottom: 32px; }

    .profile-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
    .profile-table tr { border-bottom: 1px solid #0a0a1a; }
    .profile-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 2px;
      color: #4a4a6a;
      padding: 10px 16px 10px 0;
      white-space: nowrap;
      font-weight: normal;
    }
    .profile-table td { font-size: 12px; color: #a0a8c8; padding: 10px 0; }

    .profile-comment {
      font-size: 12px;
      color: #8080a0;
      line-height: 1.9;
      border-left: 2px solid #1a1a2a;
      padding-left: 16px;
      margin-bottom: 28px;
    }

    /* 「卒業しました。」— TRUE END後は変わる */
    .status-line {
      font-size: 11px;
      color: #6a6a8a;
      letter-spacing: 1px;
      margin-bottom: 16px;
      font-style: italic;
    }

    .true-end-message {
      display: none;
      background: #0a0a1a;
      border: 1px solid #1a1a4a;
      padding: 14px 18px;
      font-size: 11px;
      color: #8080c0;
      letter-spacing: 1px;
      line-height: 2;
      margin-top: 12px;
    }

    .back-link {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 2px;
      color: #4a4a6a;
      text-decoration: none;
      margin-top: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #a0a8c8; }

    footer {
      text-align: center;
      padding: 32px;
      border-top: 1px solid #1a0a0a;
      font-size: 9px;
      color: #3a2a2a;
      letter-spacing: 2px;
      margin-top: 32px;
    }
    @media (max-width: 640px) {
      .profile-wrap { flex-direction: column; align-items: stretch; padding: 0 0 48px; gap: 0; }
      .profile-photo { width: 100%; }
      .profile-photo img { filter: brightness(0.9) saturate(0.75); }
      .profile-info { width: 100%; padding: 24px 20px 0; }
      nav { gap: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title">TOKYO MIDNIGHT GIRLS CLUB</div>
  </header>

  <nav>
    <a href="../index.html">HOME</a>
    <a href="../cast.html">GIRLS</a>
    <a href="../blog/index.html">BLOG</a>
  </nav>

  <div class="profile-wrap">

    <div class="profile-photo">
      <img src="../img/suzune_uniform.jpg" alt="すずね">
    </div>

    <div class="profile-info">
      <div class="cast-name">すずね</div>
      <div class="cast-name-sub">SUZUNE &nbsp;&#x2715;&nbsp; CAST</div>

      <table class="profile-table">
        <tr>
          <th>AGE</th>
          <td>20</td>
        </tr>
        <tr>
          <th>BIRTHDAY</th>
          <td>0220</td>
        </tr>
        <tr>
          <th>RANK</th>
          <td>—</td>
        </tr>
        <tr>
          <th>HOBBY</th>
          <td>音楽・散歩</td>
        </tr>
        <tr>
          <th>TYPE</th>
          <td>ちょっぴりおっちょこちょい笑</td>
        </tr>
      </table>

      <div class="profile-comment">
        みんなとワイワイ話すの好きです！<br>
        気軽に話しかけてね。
      </div>

      <!-- 初期状態：「卒業しました。」が不穏 -->
      <div class="status-line" id="status-default">卒業しました。</div>

      <!-- TRUE END後：更新される -->
      <div class="true-end-message" id="true-end-msg">
        また会える日を楽しみにしてます。<br>
        ありがとう。
      </div>

      <a class="back-link" href="../cast.html">← GIRLS LIST</a>
    </div>

  </div>

  <footer>
    &copy; TOKYO MIDNIGHT GIRLS CLUB &nbsp;|&nbsp; ALL RIGHTS RESERVED<br><span style="font-size:8px; color:#2a2a2a; letter-spacing:1px;">このサイトはフィクションです。登場するキャラクター・画像はすべてAIにより生成された架空のものです。</span>
  </footer>

  <script>
    if (localStorage.getItem('tmgc_end') === 'true') {
      document.getElementById('status-default').style.display = 'none';
      document.getElementById('true-end-msg').style.display = 'block';
    }
  </script>

</body>
</html>
