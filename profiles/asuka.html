<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      color: #f0e8e0;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
    }
    header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid #2a1a1a; }
    .site-title { font-size: 13px; letter-spacing: 6px; color: #c8a0a0; text-transform: uppercase; margin-bottom: 6px; }
    nav { display: flex; justify-content: center; gap: 32px; padding: 16px 20px; border-bottom: 1px solid #1a0a0a; }
    nav a { color: #c8a0a0; text-decoration: none; font-size: 11px; letter-spacing: 2px; transition: color 0.2s; }
    nav a:hover { color: #f0c0c0; }

    .profile-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
      display: flex;
      gap: 48px;
      align-items: flex-start;
    }
    .profile-photo {
      flex-shrink: 0;
      width: 220px;
      height: 300px;
      background: linear-gradient(160deg, #1a1505 0%, #252015 100%);
      overflow: hidden;
    }
    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-placeholder span { font-size: 10px; color: #3a3a2a; }

    .profile-info { flex: 1; }
    .cast-name { font-size: 26px; color: #e8e0b0; letter-spacing: 2px; margin-bottom: 6px; }
    .cast-name-sub { font-size: 10px; color: #6a6a3a; letter-spacing: 3px; margin-bottom: 32px; }

    .profile-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
    .profile-table tr { border-bottom: 1px solid #1a1a0a; }
    .profile-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 2px;
      color: #6a6a3a;
      padding: 10px 16px 10px 0;
      white-space: nowrap;
      font-weight: normal;
    }
    .profile-table td { font-size: 12px; color: #c8c0a0; padding: 10px 0; }

    .rank-badge {
      display: inline-block;
      background: #2a2a0a;
      border: 1px solid #6a6a1a;
      color: #c0c060;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 2px 8px;
    }

    .profile-comment {
      font-size: 12px;
      color: #a0a080;
      line-height: 1.9;
      border-left: 2px solid #2a2a1a;
      padding-left: 16px;
      margin-bottom: 28px;
    }

    .back-link {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 2px;
      color: #6a6a3a;
      text-decoration: none;
      margin-top: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #c8c0a0; }

    footer {
      text-align: center;
      padding: 32px;
      border-top: 1px solid #1a0a0a;
      font-size: 9px;
      color: #3a2a2a;
      letter-spacing: 2px;
      margin-top: 32px;
    }

    /* TRUE END後：プロフが非表示に */
    .profile-hidden-msg {
      display: none;
      padding: 80px 0;
      text-align: center;
      font-size: 11px;
      color: #3a2a2a;
      letter-spacing: 2px;
    }
  </style>
</head>
