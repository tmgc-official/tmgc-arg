<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAST LOG ARCHIVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050a05;
      color: #c0d0c0;
      font-family: 'Courier New', 'Courier', monospace;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .terminal {
      max-width: 600px;
      margin: 0 auto;
    }

    .terminal-header {
      font-size: 9px;
      color: #405040;
      letter-spacing: 2px;
      margin-bottom: 32px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a2a1a;
    }

    .terminal-title {
      font-size: 14px;
      color: #80c080;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .terminal-sub {
      font-size: 9px;
      color: #304030;
      letter-spacing: 3px;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }

    .log-table th {
      text-align: left;
      font-size: 9px;
      color: #405040;
      letter-spacing: 2px;
      padding: 6px 0;
      border-bottom: 1px solid #1a2a1a;
      font-weight: normal;
    }

    .log-table td {
      padding: 14px 0;
      border-bottom: 1px solid #0a1a0a;
      vertical-align: middle;
    }

    .cast-id {
      font-size: 10px;
      color: #607060;
      letter-spacing: 1px;
      width: 80px;
    }

    .cast-name-cell {
      font-size: 11px;
      color: #80c080;
    }

    .log-link {
      font-size: 10px;
      color: #405040;
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid #1a2a1a;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .log-link:hover {
      color: #80c080;
      border-color: #405040;
      background: #0a150a;
    }

    .log-separator {
      font-size: 10px;
      color: #203020;
      padding: 0 8px;
    }

    .terminal-note {
      margin-top: 32px;
      font-size: 9px;
      color: #304030;
      letter-spacing: 1px;
      line-height: 2;
      border-top: 1px solid #0a1a0a;
      padding-top: 16px;
    }

    .blink {
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      body { padding: 24px 12px; }
      .terminal-title { font-size: 12px; letter-spacing: 2px; }
      .cast-id { width: 56px; }
      .log-link { padding: 4px 6px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="terminal-title">CAST LOG ARCHIVE</div>
      <div class="terminal-sub">[INTERNAL USE ONLY]</div>
    </div>

    <table class="log-table">
      <tr>
        <th>ID</th>
        <th>CAST</th>
        <th colspan="3">LOG</th>
      </tr>
      <tr>
        <td class="cast-id">0317</td>
        <td class="cast-name-cell">もえにゃ</td>
        <td><a class="log-link" href="0317.html">OPEN</a></td>
      </tr>
      <tr>
        <td class="cast-id">0220</td>
        <td class="cast-name-cell">すずね</td>
        <td><a class="log-link" href="0220.html">OPEN</a></td>
      </tr>
      <tr>
        <td class="cast-id">0614</td>
        <td class="cast-name-cell">さら</td>
        <td><span style="font-size:10px; color:#203020;">—</span></td>
      </tr>
      <tr>
        <td class="cast-id">1103</td>
        <td class="cast-name-cell">ゆうな</td>
        <td><span style="font-size:10px; color:#203020;">—</span></td>
      </tr>
      <tr>
        <td class="cast-id">0911</td>
        <td class="cast-name-cell">天使♡あすか</td>
        <td><a class="log-link" href="K0502.html">OPEN</a></td>
      </tr>
    </table>

    <div class="terminal-note">
      &gt; IDはキャスト誕生日で管理<br>
      &gt; アクセス権限：管理者のみ<br>
      &gt; <span class="blink">_</span>
    </div>
  </div>
</body>
</html>
