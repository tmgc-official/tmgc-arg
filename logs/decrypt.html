<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAST LIST — 復号</title>
  <!-- JSZip: ブラウザ内ZIPハンドリング -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050a05;
      color: #c0d0c0;
      font-family: 'Courier New', 'Courier', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .decrypt-box {
      max-width: 480px;
      width: 100%;
    }

    .box-title {
      font-size: 10px;
      letter-spacing: 4px;
      color: #405040;
      margin-bottom: 4px;
    }

    .box-file {
      font-size: 13px;
      color: #80c080;
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      font-size: 9px;
      color: #405040;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      background: #0a150a;
      border: 1px solid #1a2a1a;
      color: #80c080;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px 14px;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #405040; }

    button {
      background: #0a150a;
      border: 1px solid #2a4a2a;
      color: #80c080;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 10px 18px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    button:hover { background: #1a2a1a; border-color: #405040; }

    .error-msg {
      display: none;
      font-size: 10px;
      color: #c04040;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    /* 復号成功後：証拠ファイル表示 */
    .evidence {
      display: none;
      margin-top: 32px;
      border: 1px solid #2a4a2a;
      background: #0a150a;
      padding: 24px;
    }

    .evidence-header {
      font-size: 9px;
      color: #405040;
      letter-spacing: 2px;
      border-bottom: 1px solid #1a2a1a;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .evidence-title {
      font-size: 12px;
      color: #80c080;
      margin-bottom: 4px;
    }

    .evidence-body {
      font-size: 12px;
      color: #6a9a6a;
      line-height: 2.2;
    }

    .cast-entry {
      border-bottom: 1px solid #0a1a0a;
      padding: 12px 0;
    }

    .cast-entry:last-of-type { border-bottom: none; }

    .cast-no { font-size: 9px; color: #304030; margin-bottom: 4px; }
    .cast-entry-name { font-size: 12px; color: #80c080; margin-bottom: 4px; }
    .cast-entry-detail { font-size: 10px; color: #506050; line-height: 1.8; }
    .cast-entry-status { display: inline-block; font-size: 9px; letter-spacing: 1px; padding: 2px 8px; }
    .status-done { background: #0a1a0a; color: #406040; border: 1px solid #1a3a1a; }
    .status-candidate { background: #1a0a0a; color: #804040; border: 1px solid #3a1a1a; }

    .hotline {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #1a2a1a;
      font-size: 9px;
      color: #304030;
      letter-spacing: 1px;
    }

    .hotline a { color: #60a060; text-decoration: none; }
    .hotline a:hover { color: #80c080; }

    /* 送信フォーム */
    .send-form {
      display: none;
      margin-top: 24px;
      border: 1px solid #1a3a1a;
      padding: 20px;
      background: #050a05;
    }

    .send-form-title {
      font-size: 10px;
      color: #405040;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .send-options { list-style: none; }

    .send-options li {
      margin-bottom: 10px;
    }

    .send-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      color: #6a9a6a;
      letter-spacing: 1px;
    }

    .send-options input[type="radio"] {
      accent-color: #80c080;
    }

    .send-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 640px) {
      body { padding: 16px; align-items: flex-start; }
      .input-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

<div class="decrypt-box">

  <div class="box-title">ENCRYPTED FILE</div>
  <div class="box-file">cast_list_0508.zip</div>

  <label for="pw-input">DECRYPTION KEY</label>
  <div class="input-row">
    <input type="text" id="pw-input" placeholder="パスワードを入力..." autocomplete="off" spellcheck="false">
    <button onclick="tryDecrypt()">OPEN</button>
  </div>
  <div class="error-msg" id="error-msg">incorrect key <span class="blink">_</span></div>

  <!-- 復号成功後 -->
  <div class="evidence" id="evidence">
    <div class="evidence-header">
      <div class="evidence-title">【キャスト移籍候補リスト】</div>
      作成日：2024/05/08　担当：天使♡あすか
    </div>

    <div class="cast-entry">
      <div class="cast-no">No.1</div>
      <div class="cast-entry-name">水瀬すずね（20）</div>
      <div class="cast-entry-detail">
        移籍先：■■■<br>
        金額：150万<br>
        承諾確認番号：sz-2024-001<br>
        状態：<span class="cast-entry-status status-done">済</span>
      </div>
    </div>

    <div class="cast-entry">
      <div class="cast-no">No.2</div>
      <div class="cast-entry-name">高橋ゆうな（18）</div>
      <div class="cast-entry-detail">
        金額：150万<br>
        状態：<span class="cast-entry-status status-candidate">候補</span>
      </div>
    </div>

    <div class="cast-entry">
      <div class="cast-no">No.3</div>
      <div class="cast-entry-name">桃田萌 / もえにゃ（19）</div>
      <div class="cast-entry-detail">
        金額：応相談<br>
        状態：<span class="cast-entry-status status-candidate">候補</span>
      </div>
    </div>

    <div class="hotline">
      通報窓口：<a href="https://www.jnatip.org/" target="_blank">info@jnatip.org</a>
    </div>

    <!-- 送信フォーム -->
    <div class="send-form" id="send-form">
      <div class="send-form-title">この証拠を、どこに送りますか？</div>
      <ul class="send-options">
        <li>
          <label>
            <input type="radio" name="dest" value="hotline">
            通報窓口（info@jnatip.org）
          </label>
        </li>
        <li>
          <label>
            <input type="radio" name="dest" value="asuka">
            天使♡あすかに送る
          </label>
        </li>
        <li>
          <label>
            <input type="radio" name="dest" value="nothing">
            何もしない
          </label>
        </li>
      </ul>
      <button class="send-btn" onclick="submitChoice()">SEND</button>
    </div>
  </div>

</div>

<script>
  const CORRECT_PASSWORD = 'sz2024001';

  function tryDecrypt() {
    const input = document.getElementById('pw-input').value.trim().toLowerCase();
    const errMsg = document.getElementById('error-msg');
    const evidence = document.getElementById('evidence');

    if (input === CORRECT_PASSWORD) {
      errMsg.style.display = 'none';
      evidence.style.display = 'block';
      document.getElementById('send-form').style.display = 'block';
      document.getElementById('pw-input').disabled = true;
      evidence.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      errMsg.style.display = 'block';
      document.getElementById('pw-input').value = '';
    }
  }

  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryDecrypt();
  });

  function submitChoice() {
    const selected = document.querySelector('input[name="dest"]:checked');
    if (!selected) {
      alert('選択してください');
      return;
    }

    const dest = selected.value;

    if (dest === 'hotline') {
      // TRUE END
      localStorage.setItem('tmgc_end', 'true');
      window.location.href = '../ending_true.html';
    } else if (dest === 'asuka') {
      // BAD END A
      localStorage.setItem('tmgc_end', 'bad_a');
      window.location.href = '../ending_bad_a.html';
    } else {
      // BAD END B
      localStorage.setItem('tmgc_end', 'bad_b');
      window.location.href = '../ending_bad_b.html';
    }
  }
</script>

</body>
</html>
